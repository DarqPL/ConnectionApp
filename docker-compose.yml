services:
  mariadb:
    image: mariadb:11
    container_name: connection-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: sapassword
      MARIADB_DATABASE: appChat
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: connection-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./ConnectionAppBackend
      dockerfile: Dockerfile
    container_name: connection-backend
    env_file:
      - ./ConnectionAppBackend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/appChat
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: sapassword
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/appchat
    ports:
      - "8080:8080"
    depends_on:
      mariadb:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  web:
    build:
      context: ./ConnectionAppWeb
      dockerfile: Dockerfile
    container_name: connection-web
    env_file:
      - ./ConnectionAppWeb/.env
    environment:
      VITE_DEV_SERVER_HOST: "0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mariadb-data:
  mongodb-data:
