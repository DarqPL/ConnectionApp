spring.application.name=ConnectionAppBackend

# MariaDB Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/appChat
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/appchat
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=connection_secretkey_who_am_i_em_yeu_ah_na_na_nah
jwt.expiration=43200000

# Server Configuration
server.port=${APP_SERVER_PORT:8080}
server.address=${APP_SERVER_ADDRESS:0.0.0.0}
server.servlet.context-path=/

# CORS / LAN development
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.16.*:*,http://172.17.*:*,http://172.18.*:*,http://172.19.*:*,http://172.2*.*:*,https://*.ngrok-free.app,http://*.ngrok-free.app,https://*.ngrok.io,http://*.ngrok.io,exp://*}
app.cors.allowed-methods=${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
app.cors.allowed-headers=${APP_CORS_ALLOWED_HEADERS:*}
app.cors.exposed-headers=${APP_CORS_EXPOSED_HEADERS:Set-Cookie,Authorization}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age-seconds=${APP_CORS_MAX_AGE_SECONDS:3600}

# Auth cookie configuration (set secure=true and same-site=None when deploying HTTPS cross-site)
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}

# Mail Configuration (Gmail SMTP)
# Thay YOUR_EMAIL và YOUR_APP_PASSWORD bằng email và App Password của bạn
# Hướng dẫn tạo App Password: Google Account -> Security -> 2-Step Verification -> App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# AWS S3 Configuration
app.s3.region=${S3_REGION:ap-southeast-1}
app.s3.bucket=${S3_BUCKET:}
app.s3.access-key=${S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
app.s3.secret-key=${S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.key-prefix=${S3_KEY_PREFIX:images}

# Upload limits (override via environment variables when needed)
app.upload.max-file-size=${APP_UPLOAD_MAX_FILE_SIZE:10MB}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${app.upload.max-file-size}
spring.servlet.multipart.max-request-size=${app.upload.max-file-size}

# Temporary account lock after policy violation (minutes)
app.security.temp-lock-minutes=${APP_SECURITY_TEMP_LOCK_MINUTES:30}

# Gemini media safety filter
app.ai.safety.enabled=${APP_AI_SAFETY_ENABLED:true}
app.ai.safety.api-key=${GEMINI_API_KEY:}
app.ai.safety.model=${APP_AI_SAFETY_MODEL:gemini-2.0-flash}
app.ai.safety.base-url=${APP_AI_SAFETY_BASE_URL:https://generativelanguage.googleapis.com}
app.ai.safety.timeout-ms=${APP_AI_SAFETY_TIMEOUT_MS:12000}
app.ai.safety.high-confidence-threshold=${APP_AI_SAFETY_HIGH_CONFIDENCE_THRESHOLD:0.85}
# Allowed: GROUP | PRIVATE | BOTH
app.ai.safety.conversation-scope=${APP_AI_SAFETY_CONVERSATION_SCOPE:GROUP}

# Gemini AI rewrite
app.ai.rewrite.enabled=${APP_AI_REWRITE_ENABLED:true}
app.ai.rewrite.api-key=${APP_AI_REWRITE_API_KEY:${GEMINI_API_KEY:}}
app.ai.rewrite.model=${APP_AI_REWRITE_MODEL:${app.ai.safety.model}}
app.ai.rewrite.fallback-model=${APP_AI_REWRITE_FALLBACK_MODEL:gemini-2.0-flash}
app.ai.rewrite.base-url=${APP_AI_REWRITE_BASE_URL:${app.ai.safety.base-url}}
app.ai.rewrite.timeout-ms=${APP_AI_REWRITE_TIMEOUT_MS:12000}
app.ai.rewrite.max-context-messages=${APP_AI_REWRITE_MAX_CONTEXT_MESSAGES:20}
app.ai.rewrite.max-retries=${APP_AI_REWRITE_MAX_RETRIES:1}

# Zego call configuration
app.zego.app-id=${ZEGO_APP_ID:0}
app.zego.server-secret=${ZEGO_SERVER_SECRET:}
app.zego.token-ttl-seconds=${APP_ZEGO_TOKEN_TTL_SECONDS:3600}

# Call behavior
app.call.ring-timeout-seconds=${APP_CALL_RING_TIMEOUT_SECONDS:30}
app.call.timeout-scan-ms=${APP_CALL_TIMEOUT_SCAN_MS:5000}

# Admin account auto-seed
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123456}
app.admin.email=${APP_ADMIN_EMAIL:admin@appchat.local}
app.admin.display-name=${APP_ADMIN_DISPLAY_NAME:Administrator}
