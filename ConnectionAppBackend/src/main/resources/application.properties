spring.application.name=ConnectionAppBackend

# MariaDB Configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/appChat
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/appchat
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=connection_secretkey_who_am_i_em_yeu_ah_na_na_nah
jwt.expiration=43200000

# Server Configuration
server.port=8080
server.address=0.0.0.0
server.servlet.context-path=/

# Auth cookie configuration (set secure=true and same-site=None when deploying HTTPS cross-site)
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

# Mail Configuration (Gmail SMTP)
# Thay YOUR_EMAIL và YOUR_APP_PASSWORD bằng email và App Password của bạn
# Hướng dẫn tạo App Password: Google Account -> Security -> 2-Step Verification -> App passwords
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# AWS S3 Configuration
app.s3.region=${S3_REGION:ap-southeast-1}
app.s3.bucket=${S3_BUCKET:}
app.s3.access-key=${S3_ACCESS_KEY:${AWS_ACCESS_KEY_ID:}}
app.s3.secret-key=${S3_SECRET_KEY:${AWS_SECRET_ACCESS_KEY:}}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.public-base-url=${S3_PUBLIC_BASE_URL:}
app.s3.key-prefix=${S3_KEY_PREFIX:images}

# Multipart upload limits
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
