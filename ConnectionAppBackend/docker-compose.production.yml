services:
  mariadb:
    image: mariadb:11.4
    container_name: appchat-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_USER: ${DB_USERNAME:-root}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: appChat
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G

  backend:
    build:
      context: .
      dockerfile: Dockerfile.production
    container_name: appchat-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/appChat?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend-net
      - frontend-net
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: appchat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot-www:/var/www/certbot:ro
      - ./certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - frontend-net
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  backend-net:
    driver: bridge
    internal: true
  frontend-net:
    driver: bridge

volumes:
  mariadb-data:
    driver: local
